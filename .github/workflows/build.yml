name: Compilar ISO PS1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Instalar compilador e ferramentas no Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mipsel-linux-gnu g++-mipsel-linux-gnu cmake build-essential git libtinyxml2-dev

    - name: Compilar e instalar mkpsxiso
      run: |
        git clone https://github.com/Lameguy64/mkpsxiso.git
        cd mkpsxiso
        mkdir build && cd build
        cmake ..
        make -j$(nproc)
        sudo make install

    - name: Compilar e instalar PSn00bSDK (v0.24)
      run: |
        git clone --branch v0.24 https://github.com/Lameguy64/PSn00bSDK.git
        cd PSn00bSDK
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchain/gcc-mipsel-linux-gnu.cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j$(nproc)
        sudo make install

    - name: Compilar a ISO do Cubo 3D
      run: |
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=/usr/local/share/psn00bsdk/gcc-mipsel-linux-gnu.cmake ..
        make iso

    - name: Salvar ISO e CUE como artefato
      uses: actions/upload-artifact@v4
      with:
        name: PS1-Cubo3D-ISO
        path: |
          build/cubo_ps1_3d.iso
          build/cubo_ps1_3d.cue
