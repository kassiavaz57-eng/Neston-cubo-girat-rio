name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build genisoimage curl tar

      - name: Baixar Toolchain e PSn00bSDK
        run: |
          # Baixa o release v0.7.0 oficial do PSn00bSDK
          curl -fL -o psn00bsdk.tar.gz https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.7.0/psn00bsdk-v0.7.0-linux64.tar.gz
          sudo tar -xzf psn00bsdk.tar.gz -C /usr/local/

      - name: Compilar o jogo
        run: |
          mkdir build && cd build
          # Procura automaticamente o arquivo de toolchain do PSn00bSDK instalado
          TOOLCHAIN_PATH=$(find /usr/local -name "psn00bsdk.cmake" | head -n 1)
          cmake -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" ..
          make -j$(nproc)
