name: Compilar ISO PS1

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PSN00BSDK: /usr/local

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Instalar dependencias no Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mipsel-linux-gnu g++-mipsel-linux-gnu cmake build-essential git libtinyxml2-dev pkg-config libpng-dev

    - name: Criar arquivo de Toolchain MIPS
      run: |
        cat << 'EOF' > $GITHUB_WORKSPACE/ps1-toolchain.cmake
        set(CMAKE_SYSTEM_NAME Generic)
        set(CMAKE_SYSTEM_PROCESSOR mips)
        set(CMAKE_C_COMPILER mipsel-linux-gnu-gcc)
        set(CMAKE_CXX_COMPILER mipsel-linux-gnu-g++)
        set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
        EOF

    - name: Compilar e instalar mkpsxiso
      run: |
        git clone --recursive https://github.com/Lameguy64/mkpsxiso.git
        cd mkpsxiso
        mkdir build && cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j$(nproc)
        sudo make install

    - name: Compilar e instalar PSn00bSDK
      run: |
        git clone --recursive https://github.com/Lameguy64/PSn00bSDK.git
        cd PSn00bSDK
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ps1-toolchain.cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j$(nproc)
        sudo make install

    - name: Compilar a ISO do Cubo 3D
      run: |
        mkdir build && cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/ps1-toolchain.cmake ..
        make iso

    - name: Salvar ISO e CUE como artefato
      uses: actions/upload-artifact@v4
      with:
        name: PS1-Cubo3D-ISO
        path: |
          build/*.iso
          build/*.cue
        if-no-files-found: error
