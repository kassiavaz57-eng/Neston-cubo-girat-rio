name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build genisoimage curl

      - name: Baixar Toolchain e PSn00bSDK pre-compilados
        run: |
          curl -LO https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.8/psn00bsdk-v0.8-linux64.tar.gz || \
          curl -LO https://github.com/Lameguy64/PSn00bSDK/releases/download/v0.7/psn00bsdk-v0.7-linux.tar.gz
          sudo tar -xzf psn00bsdk-*.tar.gz -C /usr/local/

      - name: Compilar o jogo
        run: |
          mkdir build && cd build
          PSN_CMAKE=$(find /usr/local -name "psn00bsdk.cmake" | head -n 1)
          cmake -DCMAKE_TOOLCHAIN_FILE="$PSN_CMAKE" ..
          make -j$(nproc)
