name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias e compilador MIPS
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            gcc-mipsel-linux-gnu \
            g++-mipsel-linux-gnu \
            genisoimage

      - name: Criar atalhos pro PSn00bSDK (symlinks)
        run: |
          sudo ln -sf /usr/bin/mipsel-linux-gnu-gcc /usr/local/bin/mipsel-none-elf-gcc
          sudo ln -sf /usr/bin/mipsel-linux-gnu-g++ /usr/local/bin/mipsel-none-elf-g++
          sudo ln -sf /usr/bin/mipsel-linux-gnu-as /usr/local/bin/mipsel-none-elf-as
          sudo ln -sf /usr/bin/mipsel-linux-gnu-ld /usr/local/bin/mipsel-none-elf-ld
          sudo ln -sf /usr/bin/mipsel-linux-gnu-ar /usr/local/bin/mipsel-none-elf-ar
          sudo ln -sf /usr/bin/mipsel-linux-gnu-objcopy /usr/local/bin/mipsel-none-elf-objcopy

      - name: Compilar e instalar PSn00bSDK
        run: |
          git clone --recursive https://github.com/Lameguy64/PSn00bSDK.git
          cd PSn00bSDK
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          sudo make install

      - name: Compilar o seu jogo
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/usr/local/share/psn00bsdk/psn00bsdk.cmake ..
          make -j$(nproc)
