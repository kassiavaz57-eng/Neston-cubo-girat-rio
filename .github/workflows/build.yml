name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build genisoimage curl tar

      - name: Baixar Toolchain e PSn00bSDK
        run: |
          # Acha o link do release de Linux mais recente na API do GitHub
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest | grep "browser_download_url" | grep -i "linux" | cut -d '"' -f 4 | head -n 1)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Nenhum arquivo de Linux encontrado na API do GitHub!"
            exit 1
          fi
          
          echo "Baixando SDK de: $DOWNLOAD_URL"
          curl -fL -o psn00bsdk.tar.gz "$DOWNLOAD_URL"
          sudo tar -xzf psn00bsdk.tar.gz -C /usr/local/

      - name: Compilar o jogo
        run: |
          mkdir build && cd build
          TOOLCHAIN_PATH=$(find /usr/local -name "psn00bsdk.cmake" | head -n 1)
          cmake -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" ..
          make -j$(nproc)
