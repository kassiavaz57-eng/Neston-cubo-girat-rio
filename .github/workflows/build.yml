name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build genisoimage curl unzip git

      - name: Baixar Toolchain MIPS Oficial
        run: |
          # Baixa o compilador GCC MIPS oficial do release v0.24
          TOOLCHAIN_URL=$(curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest | grep "browser_download_url" | grep -i "linux" | grep -i "gcc" | cut -d '"' -f 4 | head -n 1)
          echo "Baixando compilador de: $TOOLCHAIN_URL"
          curl -fLO "$TOOLCHAIN_URL"
          sudo unzip -q -o *.zip -d /usr/local/

          # Adiciona a pasta do compilador diretamente no PATH do GitHub Actions
          GCC_BIN_DIR=$(dirname $(find /usr/local -name "mipsel-none-elf-gcc" | head -n 1))
          echo "$GCC_BIN_DIR" >> $GITHUB_PATH

      - name: Compilar e Instalar PSn00bSDK
        run: |
          git clone --recursive https://github.com/Lameguy64/PSn00bSDK.git
          cd PSn00bSDK
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          sudo make install

      - name: Compilar o jogo
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=/usr/local/share/psn00bsdk/psn00bsdk.cmake ..
          make -j$(nproc)
