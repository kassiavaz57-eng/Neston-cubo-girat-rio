name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build genisoimage curl unzip git

      - name: Baixar Toolchain MIPS Oficial
        run: |
          TOOLCHAIN_URL=$(curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest | grep "browser_download_url" | grep -i "linux" | grep -i "gcc" | cut -d '"' -f 4 | head -n 1)
          echo "Baixando compilador de: $TOOLCHAIN_URL"
          curl -fLO "$TOOLCHAIN_URL"
          sudo unzip -q -o *.zip -d /usr/local/
          
          GCC_BIN=$(sudo find /usr/local -name "mipsel-none-elf-gcc" | head -n 1)
          GCC_DIR=$(dirname "$GCC_BIN")
          echo "$GCC_DIR" >> $GITHUB_PATH

      - name: Compilar e Instalar PSn00bSDK
        run: |
          git clone --recursive https://github.com/Lameguy64/PSn00bSDK.git
          cd PSn00bSDK
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          sudo make install

      - name: Compilar o jogo e gerar ISO
        run: |
          # Volta pra raiz do repositório
          cd $GITHUB_WORKSPACE
          
          # Cria o SYSTEM.CNF na raiz apontando para o CUBO.EXE
          echo "Criando SYSTEM.CNF na raiz..."
          echo "BOOT = cdrom:\CUBO.EXE;1" > SYSTEM.CNF
          echo "TCB = 4" >> SYSTEM.CNF
          echo "EVENT = 16" >> SYSTEM.CNF
          echo "STACK = 801FFFF0" >> SYSTEM.CNF
          
          # Prepara a pasta build e roda o cmake apontando pra raiz
          mkdir -p build && cd build
          
          TOOLCHAIN_PATH=$(sudo find /usr/local $GITHUB_WORKSPACE/PSn00bSDK -name "sdk.cmake" | head -n 1)
          sudo mkdir -p /usr/local/share/psn00bsdk
          sudo ln -sf "$TOOLCHAIN_PATH" /usr/local/share/psn00bsdk/psn00bsdk.cmake
          
          cmake -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" ..
          
          # PASSO 1: Compila apenas o executável do jogo primeiro e espera terminar
          make cubo_ps1_3d -j$(nproc)
          
          # PASSO 2: Agora gera a ISO com a certeza absoluta de que o .elf já existe
          make iso -j$(nproc)

      - name: Salvar ISO do Jogo como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: cubo-ps1-iso
          path: |
            build/*.bin
            build/*.cue
