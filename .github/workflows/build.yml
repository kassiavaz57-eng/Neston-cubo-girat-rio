name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build genisoimage curl unzip git

      - name: Baixar Toolchain MIPS Oficial
        run: |
          TOOLCHAIN_URL=$(curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest | grep "browser_download_url" | grep -i "linux" | grep -i "gcc" | cut -d '"' -f 4 | head -n 1)
          echo "Baixando compilador de: $TOOLCHAIN_URL"
          curl -fLO "$TOOLCHAIN_URL"
          sudo unzip -q -o *.zip -d /usr/local/
          
          GCC_BIN=$(sudo find /usr/local -name "mipsel-none-elf-gcc" | head -n 1)
          GCC_DIR=$(dirname "$GCC_BIN")
          echo "$GCC_DIR" >> $GITHUB_PATH

      - name: Compilar e Instalar PSn00bSDK
        run: |
          git clone --recursive https://github.com/Lameguy64/PSn00bSDK.git
          cd PSn00bSDK
          mkdir build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          sudo make install

      - name: Compilar o jogo e gerar ISO
        run: |
          # Volta pra raiz do repositório
          cd $GITHUB_WORKSPACE
          
          # 1. Cria o SYSTEM.CNF na raiz do projeto
          echo "Criando SYSTEM.CNF..."
          echo "BOOT = cdrom:\CUBO_PS1_3D.EXE;1" > SYSTEM.CNF
          echo "TCB = 4" >> SYSTEM.CNF
          echo "EVENT = 16" >> SYSTEM.CNF
          echo "STACK = 801FFFF0" >> SYSTEM.CNF
          
          # Prepara a pasta build
          mkdir -p build && cd build
          
          # Acha o arquivo com o nome novo (sdk.cmake)
          TOOLCHAIN_PATH=$(sudo find /usr/local $GITHUB_WORKSPACE/PSn00bSDK -name "sdk.cmake" | head -n 1)
          
          if [ -z "$TOOLCHAIN_PATH" ]; then
            echo "Deu ruim, nem o arquivo com nome novo foi encontrado!"
            exit 1
          fi
          
          echo "Achei o arquivo disfarçado: $TOOLCHAIN_PATH"
          
          # Gambiarra máxima: cria um atalho pro seu CMakeLists antigo achar o arquivo no caminho velho
          sudo mkdir -p /usr/local/share/psn00bsdk
          sudo ln -sf "$TOOLCHAIN_PATH" /usr/local/share/psn00bsdk/psn00bsdk.cmake
          
          # Configura com o CMake
          cmake -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" ..
          
          # 2. Compila o binário do jogo (.elf)
          make -j$(nproc)
          
          # 3. Joga o SYSTEM.CNF e o executável renomeado em maiúsculo PARA DENTRO da build
          cp ../SYSTEM.CNF ./SYSTEM.CNF
          if [ -f "cubo_ps1_3d.elf" ]; then
            cp cubo_ps1_3d.elf CUBO_PS1_3D.EXE
          elif [ -f "cubo_ps1_3d" ]; then
            cp cubo_ps1_3d CUBO_PS1_3D.EXE
          fi
          
          # 4. Roda o make de novo para o mkpsxiso achar tudo mastigado
          make -j$(nproc)

      - name: Salvar ISO do Jogo como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: cubo-ps1-iso
          path: |
            build/*.bin
            build/*.cue
