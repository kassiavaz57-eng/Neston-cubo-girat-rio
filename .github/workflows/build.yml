name: Build PS1 Game

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do jogo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build genisoimage curl tar unzip

      - name: Baixar Toolchain e PSn00bSDK
        run: |
          # Baixa TODOS os arquivos de Linux do ultimo release (compilador + SDK)
          curl -s https://api.github.com/repos/Lameguy64/PSn00bSDK/releases/latest \
          | grep "browser_download_url" \
          | grep -i "linux" \
          | cut -d '"' -f 4 \
          | while read -r url; do
              echo "Baixando: $url"
              curl -fLO "$url"
            done

          # Descompacta automaticamente tanto arquivos .zip quanto .tar.gz
          for file in *; do
            if [[ "$file" == *.zip ]]; then
              echo "Descompactando ZIP: $file"
              sudo unzip -q -o "$file" -d /usr/local/
            elif [[ "$file" == *.tar.gz ]]; then
              echo "Descompactando TAR.GZ: $file"
              sudo tar -xzf "$file" -C /usr/local/
            fi
          done

      - name: Compilar o jogo
        run: |
          mkdir build && cd build
          TOOLCHAIN_PATH=$(find /usr/local -name "psn00bsdk.cmake" | head -n 1)
          if [ -z "$TOOLCHAIN_PATH" ]; then
            echo "Erro: psn00bsdk.cmake nao encontrado!"
            exit 1
          fi
          echo "Usando Toolchain em: $TOOLCHAIN_PATH"
          cmake -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" ..
          make -j$(nproc)

      - name: Compilar o jogo
        run: |
          mkdir build && cd build
          TOOLCHAIN_PATH=$(find /usr/local -name "psn00bsdk.cmake" | head -n 1)
          cmake -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_PATH" ..
          make -j$(nproc)
